# 2D scalar convection–diffusion (heat) regression case.
#
# Periodic box [0,1]^2, uniform velocity a = (1, 0.5, 0), alpha = 0.01.
# Exact Fourier mode:
#   T = A sin(kx x + ky y - (a.k) t) exp(-alpha (kx^2 + ky^2) t)
# with A = 1 and kx = ky = 2*pi.
#
# Stored L2 at N=64, t=0.2 is about 9.7e-4.

solver: saturnHeat

units:
  system: SI

mesh:
  type: box
  nx: 64
  ny: 64
  nz: 1
  box:
    xmin: 0.0
    xmax: 1.0
    ymin: 0.0
    ymax: 1.0
    zmin: 0.0
    zmax: 1.0

time:
  start: 0.0
  end: 0.2
  scheme: ssprk3
  adaptive: true
  cfl: 0.3
  dtMax: 0.005
  maxSteps: 100000

heat:
  alpha: 0.01
  velocityX: 1.0
  velocityY: 0.5
  velocityZ: 0.0
  source: 0.0
  periodic: true
  initial: fourier
  amplitude: 1.0
  kx: 6.283185307179586
  ky: 6.283185307179586
  kz: 0.0

numerics:
  convection: muscl
  limiter: vanLeer

output:
  prefix: results/heat2d/fourier64
  csv: true
  json: true
  exact: true
  vtkEvery: 0
