solver: saturnBurger

units:
  system: SI

mesh:
  type: box
  nx: 32
  ny: 1
  nz: 1
  box:
    xmin: 0.0
    xmax: 1.0
    ymin: 0.0
    ymax: 1.0
    zmin: 0.0
    zmax: 1.0

time:
  start: 0.0
  end: 0.2
  scheme: ssprk3
  adaptive: true
  cfl: 0.3
  dtMax: 0.01
  maxSteps: 10000

burgers:
  nu: 0.02
  velocity: 1.0
  x0: 0.25
  y0: 0.0
  z0: 0.0
  source: 0.0
  periodic: false
  initial: travelingWave

numerics:
  convection: muscl
  limiter: vanLeer

output:
  prefix: results/burgers/full
  csv: false
  json: true
  exact: true
  vtkEvery: 0
  checkpointEvery: 0
