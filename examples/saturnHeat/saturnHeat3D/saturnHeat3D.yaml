# saturnHeat 3D standalone example
#
# 3D scalar convection–diffusion (heat) equation:
#   dT/dt + div(a T) = alpha lap(T)
#
# Periodic box [0,1]^3, uniform prescribed velocity a = (1, 0.5, 0.25).
#
# The exact Fourier mode is
#   T(x,y,z,t) = A sin(k.x - (a.k) t) exp(-alpha |k|^2 t)
# with A = 1, k = 2*pi*(1,1,1), alpha = 0.01.
#
# Run and compare:
#   saturnCFD saturnHeat3D.yaml
#   python3 compareAnalytic.py

solver: saturnHeat

units:
  system: SI

mesh:
  type: box
  nx: 48
  ny: 48
  nz: 48
  box:
    xmin: 0.0
    xmax: 1.0
    ymin: 0.0
    ymax: 1.0
    zmin: 0.0
    zmax: 1.0

time:
  start: 0.0
  end: 0.1
  scheme: ssprk3
  adaptive: true
  cfl: 0.3
  dtMax: 0.002
  maxSteps: 100000

heat:
  alpha: 0.01
  velocityX: 1.0
  velocityY: 0.5
  velocityZ: 0.25
  source: 0.0
  periodic: true
  initial: fourier
  amplitude: 1.0
  kx: 6.283185307179586
  ky: 6.283185307179586
  kz: 6.283185307179586

numerics:
  convection: muscl
  limiter: vanLeer

output:
  prefix: results/saturnHeat3D/fourier
  csv: true
  json: true
  exact: true
  vtkEvery: 25
