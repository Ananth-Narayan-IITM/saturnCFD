# saturnCFD case file — lid-driven cavity, quick demo
#
# This is the fastest case: 64 x 64, Re = 100, reaches steady state in seconds.
# Use it to check that your build works.
#
#   saturnCFD examples/cavity/demo.yaml --threads 8
#
# Regenerate every available option with:
#   saturnCFD --dump-config cavity

solver: cavity

domain:
  nx: 64
  ny: 64
  length: 1.0

flow:
  reynolds: 100
  lidVelocity: 1.0
  scheme: minmod
  cfl: 0.4
  diffusionSafety: 0.2

time:
  endTime: 60.0
  maxSteps: 200000
  steadyTol: 1.0e-6
  checkEvery: 50

pressure:
  maxIter: 200
  tolerance: 1.0e-6

output:
  prefix: results/cavity/demo
  centreLines: true
  vtkEvery: 0
