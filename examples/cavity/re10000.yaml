# saturnCFD case file — lid-driven cavity, Re = 10000, 256 x 256
#
# WARNING: this is a long run. At Re = 10000 the cavity is genuinely unsteady,
# so it will NOT satisfy the steady-state tolerance; it will run to endTime.
# Reduce endTime first, and use vtkEvery to inspect the transient.
#
# The 256^2 grid is the minimum for a credible Re = 10000 comparison
# (Ghia et al. used a 257 x 257 grid).
#
#   saturnCFD examples/cavity/re10000.yaml
#
# On the current CG pressure solver this is many hours on a laptop CPU.
# Multigrid is required before this case is practical — see docs/Solver.md §6.

solver: cavity

domain:
  nx: 256
  ny: 256
  length: 1.0

flow:
  reynolds: 10000
  lidVelocity: 1.0
  scheme: minmod
  cfl: 0.4
  diffusionSafety: 0.25

time:
  endTime: 60.0
  maxSteps: 2000000
  steadyTol: 1.0e-5
  checkEvery: 500

pressure:
  maxIter: 5000
  tolerance: 1.0e-9

output:
  prefix: results/cavity/re10000
  centreLines: true
  vtkEvery: 2000
