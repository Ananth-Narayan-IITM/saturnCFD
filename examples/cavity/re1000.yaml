# saturnCFD case file — lid-driven cavity, Re = 1000, 128 x 128
#
# The classical validation point. Note that the diffusion timestep limit
# (h^2 / 4nu) is no longer binding here: the convective CFL condition controls
# dt, which is why higher Re needs more steps, not smaller ones, on a fixed grid.
#
#   saturnCFD examples/cavity/re1000.yaml
#
# Expect ~10-30 minutes on a laptop CPU. On a GPU, minutes.

solver: cavity

domain:
  nx: 128
  ny: 128
  length: 1.0

flow:
  reynolds: 1000
  lidVelocity: 1.0
  scheme: minmod
  cfl: 0.4
  diffusionSafety: 0.25

time:
  endTime: 250.0
  maxSteps: 800000
  steadyTol: 1.0e-5
  checkEvery: 200

pressure:
  maxIter: 200
  tolerance: 1.0e-6

output:
  prefix: results/cavity/re1000
  centreLines: true
  vtkEvery: 1000
