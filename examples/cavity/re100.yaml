# saturnCFD case file — lid-driven cavity, Re = 100, 128 x 128
#
# Reference: Ghia, Ghia & Shin (1982), J. Comput. Phys. 48, 387-411.
# At this resolution a TVD-limited scheme matches the benchmark to ~2%.
#
#   saturnCFD examples/cavity/re100.yaml

solver: cavity

domain:
  nx: 128
  ny: 128
  length: 1.0

flow:
  reynolds: 100
  lidVelocity: 1.0
  scheme: minmod
  cfl: 0.4
  diffusionSafety: 0.25

time:
  endTime: 120.0
  maxSteps: 400000
  steadyTol: 1.0e-6
  checkEvery: 100

pressure:
  maxIter: 5000
  tolerance: 1.0e-9

output:
  prefix: results/cavity/re100
  centreLines: true
  vtkEvery: 200
