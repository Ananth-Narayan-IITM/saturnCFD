# saturnStokes 3D Poiseuille validation
#
# A plane channel extruded along z and periodic in x and z:
#   -mu u'' = G,  u(0) = u(H) = 0,
# with exact u(y) = G/(2 mu) y (H-y), v = w = 0.
#
# The 3D coupled u-v-w-p saddle-point system is solved with PETSc.

solver: saturnStokes

units:
  system: SI

mesh:
  type: box
  nx: 24
  ny: 24
  nz: 8
  box:
    xmin: 0.0
    xmax: 1.0
    ymin: 0.0
    ymax: 1.0
    zmin: 0.0
    zmax: 1.0

stokes:
  case: poiseuille
  mu: 1.0
  forceX: 1.0

output:
  prefix: results/saturnStokes3D/poiseuille
  csv: true
  json: true
  exact: true
  vtkEvery: 1
