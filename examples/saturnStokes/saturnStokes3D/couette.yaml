# saturnStokes 3D Couette validation
#
# Lower wall at rest, upper wall moving at U, extruded along z and periodic
# in x and z:
#   u(0) = 0, u(H) = U,  u(y) = U y/H,  v = w = 0.
#
# The 3D coupled u-v-w-p saddle-point system is solved with PETSc.

solver: saturnStokes

units:
  system: SI

mesh:
  type: box
  nx: 24
  ny: 24
  nz: 8
  box:
    xmin: 0.0
    xmax: 1.0
    ymin: 0.0
    ymax: 1.0
    zmin: 0.0
    zmax: 1.0

stokes:
  case: couette
  mu: 1.0
  wallVelocityX: 1.0
  linearSolver: direct

output:
  prefix: results/saturnStokes3D/couette
  csv: true
  json: true
  exact: true
  vtkEvery: 0
