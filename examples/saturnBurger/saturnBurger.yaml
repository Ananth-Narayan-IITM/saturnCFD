# saturnBurger standalone example
#
# 1D viscous Burgers equation:
#   du/dt + d/dx(u^2/2) = nu d2u/dx2
#
# The initial and Dirichlet boundary data are the exact traveling wave
#   u(x,t) = U/2 * (1 - tanh(U*(x - x0 - U*t/2)/(4*nu)))
# with U = 1, nu = 0.02, x0 = 0.
#
# At t = 0.5 the wave centre moves from x = 0.25 to x = 0.5. Run and compare:
#   saturnCFD saturnBurger.yaml
#   python3 compareAnalytic.py
#
# The comparison script re-computes the analytic solution independently from
# this YAML (it does not reuse the solver's exact column) and writes a plot.

solver: saturnBurger

units:
  system: SI

mesh:
  type: box
  nx: 32          # cells in x
  ny: 1            # 1D: must stay 1
  nz: 1            # 1D: must stay 1
  box:
    xmin: 0.0
    xmax: 1.0
    ymin: 0.0
    ymax: 1.0
    zmin: 0.0
    zmax: 1.0

time:
  start: 0.0
  end: 0.5
  scheme: ssprk3
  adaptive: true
  cfl: 0.3
  dtMax: 0.01
  maxSteps: 100000

burgers:
  nu: 0.02
  velocity: 1.0
  x0: 0.25
  source: 0.0
  periodic: false
  initial: travelingWave

numerics:
  convection: muscl
  limiter: vanLeer

output:
  prefix: .
  csv: true       # x, u_numerical, u_exact, error
  json: true      # L1, L2, Linf and exact norms
  exact: true     # compare against the solver's analytic solution
  vtkEvery: 0
