# saturnCFD sample configuration
# Every option is documented; run `saturnCFD --dump-config` for the full list
# the code actually reads.

domain:
  nx: 1024          # cells in x at level 0
  ny: 1024          # cells in y at level 0
  nz: 64            # cells in z (3D builds only)
  lx: 1.0           # physical length in x
  ly: 1.0           # physical length in y
  lz: 1.0           # physical length in z (3D builds only)

grid:
  block_x: 256      # max patch size in x  -> 4 patches
  block_y: 256      # max patch size in y  -> 4 patches
  block_z: 32
  nghost: 2         # ghost layers per field

boundary:
  periodic: true    # periodic in every direction

output:
  every: 0          # 0 = no VTK, N = write every N steps
  prefix: output/field

bench:
  iters: 50         # stencil iterations for the bandwidth benchmark
  verify_halo: true # compare ghost cells against the analytic field
