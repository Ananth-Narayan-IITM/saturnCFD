<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">saturnCFD</title>
  <desc id="logoDesc">A navy Saturn with fine amber rings and a cream rim.
  The letters CFD sit in the gap between the planet and the front ring, peeking
  out from under it.</desc>

  <defs>
    <clipPath id="planetClip">
      <circle cx="256" cy="250" r="144"/>
    </clipPath>
    <clipPath id="frontHalf">
      <rect x="-400" y="250" width="800" height="400"/>
    </clipPath>

    <g id="rings" fill="none" stroke="#D89A3A">
      <ellipse cx="256" cy="250" rx="244" ry="62" stroke-width="24" opacity="0.13"/>
      <ellipse cx="256" cy="250" rx="244" ry="62" stroke-width="3" opacity="0.95"/>
      <ellipse cx="256" cy="250" rx="232" ry="58" stroke-width="8.5" opacity="0.88"/>
      <ellipse cx="256" cy="250" rx="218" ry="53" stroke-width="1.6" opacity="0.60"/>
      <ellipse cx="256" cy="250" rx="204" ry="48" stroke-width="1.1" opacity="0.40"/>
      <ellipse cx="256" cy="250" rx="252" ry="65" stroke-width="1.0" opacity="0.30"/>
    </g>
  </defs>

  <!-- Back rings. -->
  <g transform="rotate(-15 256 250)">
    <use href="#rings"/>
  </g>

  <!-- Planet: solid navy with a gold rim. On light backgrounds the navy body
       defines the disc; on dark backgrounds the gold rim still does. -->
  <circle cx="256" cy="250" r="147" fill="none" stroke="#D89A3A"
          stroke-width="10" opacity="0.08"/>
  <circle cx="256" cy="250" r="144" fill="#0D1B2A" stroke="#D89A3A"
          stroke-width="2.4"/>

  <g clip-path="url(#planetClip)">
    <!-- Warm atmosphere on the lit limb. -->
    <circle cx="256" cy="250" r="144" fill="#F2E7D0" opacity="0.10"/>
    <circle cx="274" cy="268" r="144" fill="#0D1B2A"/>
    <!-- Fine amber rim light on the lower-right limb. -->
    <circle cx="256" cy="250" r="142" fill="none" stroke="#D89A3A"
            stroke-width="3" opacity="0.55"/>
    <!-- A faint equatorial band, like the reference emblem. -->
    <path d="M112 292 Q256 278 400 292" fill="none" stroke="#D89A3A"
          stroke-width="7" opacity="0.10"/>
  </g>

  <!-- Hexagonal polar vortex, small and understated. -->
  <g clip-path="url(#planetClip)">
    <g transform="rotate(-4 318 178)">
      <polygon points="340,178 329,197 307,197 296,178 307,159 329,159"
               fill="#D89A3A" fill-opacity="0.10" stroke="#D89A3A"
               stroke-width="1.8" stroke-linejoin="round" opacity="0.55"/>
      <path d="M318 170 a8 8 0 1 0 8 8" fill="none" stroke="#D89A3A"
            stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
      <circle cx="318" cy="178" r="1.8" fill="#F2E7D0" opacity="0.65"/>
    </g>
  </g>

  <!-- Wordmark: cream letters in the gap between planet and front ring. -->
  <g transform="rotate(-15 256 250)">
    <text x="256" y="345" text-anchor="middle"
          font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
          font-size="80" font-weight="700" letter-spacing="3"
          fill="#F2E7D0">CFD</text>
  </g>

  <!-- Front rings: they cross the wordmark, so the letters peek out below. -->
  <g transform="rotate(-15 256 250)" clip-path="url(#frontHalf)">
    <use href="#rings"/>
  </g>
</svg>
