name: docs

on:
  push:
    branches: [v1, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build HTML
        run: |
          mkdir -p build-cpu
          doxygen docs/Doxyfile

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: saturnCFD-docs-html
          path: build-cpu/doxygen/html

      # Branch deployment avoids the Pages create-site API, which a
      # workflow token is not allowed to call. Enable Pages once with:
      # Settings -> Pages -> Deploy from a branch -> gh-pages / (root).
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build-cpu/doxygen/html
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

  pdf:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            doxygen graphviz \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended latexmk

      - name: Build PDF
        run: |
          mkdir -p build-cpu
          doxygen docs/Doxyfile
          make -C build-cpu/doxygen/latex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: saturnCFD-docs-pdf
          path: build-cpu/doxygen/latex/refman.pdf
